apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ponctuel.secretName" . }}
  labels:
    {{- include "ponctuel.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.database.password | quote }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s-db:%d/%s?sslmode=disable" .Values.database.user .Values.database.password (include "ponctuel.fullname" .) (int .Values.database.servicePort) .Values.database.name | quote }}
  STM_API_KEY: {{ .Values.secrets.stmApiKey | quote }}
