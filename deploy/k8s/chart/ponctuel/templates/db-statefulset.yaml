apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "ponctuel.fullname" . }}-db
  labels:
    {{- include "ponctuel.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  serviceName: {{ include "ponctuel.fullname" . }}-db
  replicas: 1
  selector:
    matchLabels:
      {{- include "ponctuel.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        {{- include "ponctuel.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: database
    spec:
      serviceAccountName: {{ include "ponctuel.serviceAccountName" . }}
      automountServiceAccountToken: false
      containers:
        - name: database
          image: {{ .Values.database.image | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.database.name | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.database.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ponctuel.secretName" . }}
                  key: POSTGRES_PASSWORD
          ports:
            - name: postgres
              containerPort: {{ .Values.database.servicePort }}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: migrations
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: migrations
          configMap:
            name: {{ .Values.database.migrationsConfigMap }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "ponctuel.labels" . | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.database.storage }}
