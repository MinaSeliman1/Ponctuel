apiVersion: v1
kind: Service
metadata:
  name: {{ include "ponctuel.fullname" . }}-db
  labels:
    {{- include "ponctuel.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: postgres
      port: {{ .Values.database.servicePort }}
      targetPort: postgres
  selector:
    {{- include "ponctuel.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: database
