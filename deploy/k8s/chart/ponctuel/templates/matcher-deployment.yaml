apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ponctuel.fullname" . }}-matcher
  labels:
    {{- include "ponctuel.labels" . | nindent 4 }}
    app.kubernetes.io/component: matcher
spec:
  replicas: {{ .Values.replicas.matcher }}
  selector:
    matchLabels:
      {{- include "ponctuel.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: matcher
  template:
    metadata:
      labels:
        {{- include "ponctuel.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: matcher
    spec:
      serviceAccountName: {{ include "ponctuel.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: matcher
          image: "{{ .Values.images.matcher.repository }}:{{ .Values.images.matcher.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
          envFrom:
            - configMapRef:
                name: {{ include "ponctuel.configMapName" . }}
            - secretRef:
                name: {{ include "ponctuel.secretName" . }}
          env:
            - name: MATCHER_HTTP_ADDR
              value: ":8082"
            - name: MATCHER_STOPS_FILE
              value: /app/testdata/gtfs/stops.txt
          ports:
            - name: http
              containerPort: 8082
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
