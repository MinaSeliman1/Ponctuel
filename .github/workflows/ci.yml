name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go tests and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          cache: true
      - run: go test ./...
      - run: go vet ./...

  database-integration:
    name: Database integration
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb:2.30.0-pg17
        env:
          POSTGRES_DB: ponctuel
          POSTGRES_USER: ponctuel
          POSTGRES_PASSWORD: ponctuel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ponctuel -d ponctuel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          cache: true
      - name: Run database-backed tests
        env:
          TEST_DATABASE_URL: postgres://ponctuel:ponctuel@127.0.0.1:5432/ponctuel?sslmode=disable
        run: go test ./services/ingester/store
      - name: Run GTFS database-backed tests
        env:
          TEST_DATABASE_URL: postgres://ponctuel:ponctuel@127.0.0.1:5432/ponctuel?sslmode=disable
        run: go test ./services/ingester/gtfs

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test -- --run
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  python:
    name: Predictor tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/predictor/requirements.txt
      - run: python -m pip install --requirement services/predictor/requirements.txt
      - run: python -m pytest services/predictor -q

  docker:
    name: Docker images and Compose config
    runs-on: ubuntu-latest
    needs: [go, database-integration, frontend, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: docker compose -f deploy/compose/docker-compose.yml config
      - run: docker build -f Dockerfile.api -t ponctuel-api:ci .
      - run: docker build -f Dockerfile.ingester -t ponctuel-ingester:ci .
      - run: docker build -f Dockerfile.matcher -t ponctuel-matcher:ci .
      - run: docker build -f Dockerfile.web -t ponctuel-web:ci .
      - run: docker build -f Dockerfile.predictor -t ponctuel-predictor:ci .

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e

  kubernetes:
    name: Helm chart validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310
        with:
          version: v3.17.3
      - run: helm lint deploy/k8s/chart/ponctuel
      - run: helm template ponctuel deploy/k8s/chart/ponctuel > /tmp/ponctuel-k8s.yaml
      - run: |
          test "$(grep -c '^kind: ' /tmp/ponctuel-k8s.yaml)" -ge 12
      - run: '! helm template ponctuel deploy/k8s/chart/ponctuel --show-only templates/configmap.yaml | grep -q "  STM_API_KEY:"'

